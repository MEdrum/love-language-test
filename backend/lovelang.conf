limit_req_zone $http_cf_connecting_ip zone=lovelang_requests:1m rate=2r/s;

server {
    listen 80;
    server_name lovelang.fabianflow.de;
    access_log off;
    add_header Referrer-Policy no-referrer always;

    location /api/v1/results/ {
        client_max_body_size 128k;
        limit_req zone=lovelang_requests burst=20 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=30s;
        set $lovelang_backend lovelang-api:8770;
        proxy_pass http://$lovelang_backend;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 12s;
    }

    location ~ "^/r/([a-z0-9][a-z0-9-]{0,63})$" {
        return 302 https://medrum.github.io/love-language-test/?result=$1;
    }

    location = / {
        return 302 https://medrum.github.io/love-language-test/;
    }

    location / {
        return 404;
    }
}
